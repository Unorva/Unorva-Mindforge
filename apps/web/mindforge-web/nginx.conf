server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clipboard images are limited to 10 MiB plus multipart framing by the API.
    location = /api/files/images {
        client_max_body_size 12m;
        proxy_pass http://mindforge-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location = /mail/events {
        proxy_pass http://mindforge-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 70s;
    }

    # The backend service is named "mindforge-server" on the deployment network.
    # A trailing slash is deliberately omitted to preserve the API path.
    location ~ ^/(api|users|daily-reviews|projects|finance|mail|ai|dashboard)(/|$) {
        proxy_pass http://mindforge-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    # Auth page routes use the SPA fallback; only these endpoints reach the API.
    location ~ ^/auth/(login|register|logout)$ {
        proxy_pass http://mindforge-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
